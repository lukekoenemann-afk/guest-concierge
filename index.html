<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Guest Concierge</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-outer: #0F1B2B;
    --card: #16233A;
    --card-border: #2A3B54;
    --chat-bg: #101d30;
    --bubble-assistant: #1F3049;
    --gold: #C6A15B;
    --gold-light: #E4C888;
    --gold-hover: #D4B36F;
    --cream: #F4EFE3;
    --text-muted: #8494AB;
    --text-body: #EAEFF6;
    --text-faint: #5C6C82;
    --text-footer: #3E5473;
    --pill-text: #B9C4D3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg-outer);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    font-family: 'Inter', system-ui, sans-serif;
  }
  .display { font-family: 'Fraunces', serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .wrap { width: 100%; max-width: 440px; }
  .card {
    position: relative;
    background: var(--card);
    border-radius: 16px;
    border: 1px solid var(--card-border);
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    overflow: hidden;
  }
  .stripe { height: 8px; background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold)); }
  .header {
    padding: 20px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    border-bottom: 1px solid var(--card-border);
  }
  .eyebrow { font-size: 10px; letter-spacing: 0.25em; color: var(--gold); text-transform: uppercase; margin-bottom: 4px; }
  .title { font-size: 26px; color: var(--cream); line-height: 1.2; }
  .subtitle { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .chat {
    height: 420px;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: var(--chat-bg);
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.assistant { justify-content: flex-start; }
  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.4;
  }
  .bubble.user {
    background: var(--gold);
    color: var(--bg-outer);
    border-bottom-right-radius: 4px;
  }
  .bubble.assistant {
    background: var(--bubble-assistant);
    color: var(--text-body);
    border: 1px solid var(--card-border);
    border-bottom-left-radius: 4px;
  }
  .suggestions { padding: 0 20px 12px; display: flex; flex-wrap: wrap; gap: 8px; background: var(--chat-bg); }
  .pill {
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 9999px;
    background: var(--bubble-assistant);
    border: 1px solid var(--card-border);
    color: var(--pill-text);
    cursor: pointer;
  }
  .pill:hover { border-color: var(--gold); color: var(--gold); }
  .inputRow { padding: 12px; border-top: 1px solid var(--card-border); background: var(--card); display: flex; gap: 8px; }
  #msgInput {
    flex: 1;
    background: var(--bg-outer);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    color: var(--text-body);
    outline: none;
    font-family: 'Inter', sans-serif;
  }
  #msgInput::placeholder { color: var(--text-faint); }
  #sendBtn {
    width: 40px; height: 40px; border-radius: 8px; background: var(--gold);
    border: none; color: var(--bg-outer); cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  #sendBtn:disabled { opacity: 0.4; cursor: default; }
  .footer { text-align: center; margin-top: 12px; font-size: 10px; letter-spacing: 0.15em; color: var(--text-footer); text-transform: uppercase; }
  .dots { display: flex; gap: 6px; align-items: center; }
  .dot { width: 6px; height: 6px; border-radius: 9999px; background: var(--gold); animation: bounce 1s infinite; }
  .dot:nth-child(2) { animation-delay: -0.15s; }
  .dot:nth-child(1) { animation-delay: -0.3s; }
  @keyframes bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-4px); } }
  .errorState { padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 14px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="stripe"></div>
      <div class="header">
        <div>
          <div class="eyebrow mono">Digital Concierge</div>
          <div class="title display" id="propertyName">Loading…</div>
          <div class="subtitle" id="propertyAddress"></div>
        </div>
      </div>
      <div class="chat" id="chat"></div>
      <div class="suggestions" id="suggestions"></div>
      <div class="inputRow">
        <input id="msgInput" type="text" placeholder="Ask about check-in, wifi, rules…" />
        <button id="sendBtn" aria-label="Send">➤</button>
      </div>
    </div>
    <div class="footer mono">Powered by your host's concierge</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const propertyId = params.get("property");
    let messages = [];
    let loading = false;

    const chatEl = document.getElementById("chat");
    const nameEl = document.getElementById("propertyName");
    const addrEl = document.getElementById("propertyAddress");
    const suggestEl = document.getElementById("suggestions");
    const inputEl = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");

    function renderMessages() {
      chatEl.innerHTML = "";
      messages.forEach((m) => {
        const row = document.createElement("div");
        row.className = "row " + m.role;
        const bubble = document.createElement("div");
        bubble.className = "bubble " + m.role;
        bubble.textContent = m.text;
        row.appendChild(bubble);
        chatEl.appendChild(row);
      });
      if (loading) {
        const row = document.createElement("div");
        row.className = "row assistant";
        row.innerHTML = '<div class="bubble assistant dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
        chatEl.appendChild(row);
      }
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    async function sendMessage(overrideText) {
      const text = (overrideText ?? inputEl.value).trim();
      if (!text || loading) return;
      messages.push({ role: "user", text });
      inputEl.value = "";
      loading = true;
      sendBtn.disabled = true;
      renderMessages();
      suggestEl.style.display = "none";

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ propertyId, messages }),
        });
        const data = await res.json();
        messages.push({ role: "assistant", text: data.reply || "Something went wrong — please try again." });
      } catch (e) {
        messages.push({ role: "assistant", text: "Something went wrong reaching the concierge. Please try again." });
      } finally {
        loading = false;
        sendBtn.disabled = !inputEl.value.trim();
        renderMessages();
      }
    }

    inputEl.addEventListener("input", () => { sendBtn.disabled = !inputEl.value.trim() || loading; });
    inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });
    sendBtn.addEventListener("click", () => sendMessage());

    async function init() {
      if (!propertyId) {
        document.querySelector(".card").innerHTML = '<div class="errorState">No property specified. Add <span class="mono">?property=your-id</span> to the URL.</div>';
        return;
      }
      try {
        const res = await fetch("/api/property?property=" + encodeURIComponent(propertyId));
        if (!res.ok) throw new Error("not found");
        const info = await res.json();
        nameEl.textContent = info.propertyName;
        addrEl.textContent = info.address;
        messages = [{ role: "assistant", text: `Welcome to ${info.propertyName}. I'm here to help with check-in, wifi, house rules, or local tips — ask me anything.` }];
        renderMessages();
        (info.suggestions || []).forEach((s) => {
          const pill = document.createElement("button");
          pill.className = "pill";
          pill.textContent = s;
          pill.onclick = () => sendMessage(s);
          suggestEl.appendChild(pill);
        });
        sendBtn.disabled = true;
      } catch (e) {
        document.querySelector(".card").innerHTML = '<div class="errorState">Property not found. Check the link and try again.</div>';
      }
    }

    init();
  </script>
</body>
</html>
